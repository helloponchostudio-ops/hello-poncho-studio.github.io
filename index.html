<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Centers the image perfectly on the screen */
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        /* Ensures whatever image loads is responsive and fits nicely */
        picture, img {
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <picture>
        <source media="(max-width: 768px)" srcset="images/PonchoStudio_Landing_V2_mobile.jpg">
        
        <img src="images/PonchoStudio_Landing_V2.jpg" alt="Welcome to Our Website">
    </picture>

</body>
</html>
